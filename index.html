<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ท่องเที่ยวเกาะล้าน</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 text-gray-800 font-sans">

  <!-- Navigation Bar -->
  <header class="fixed top-0 w-full bg-green-200 shadow-md p-4 flex justify-between items-center">
    <h1 class="text-lg font-bold text-green-700">ท่องเที่ยวเกาะล้าน</h1>
    <button class="bg-green-500 text-white px-3 py-1 rounded">เมนู</button>
  </header>

  <!-- Content Feed -->
  <main id="feed" class="pt-20 pb-20 px-4">
    <div class="bg-white shadow rounded-lg p-4 mb-4">
      <h2 class="text-xl font-semibold text-green-600">ยินดีต้อนรับ!</h2>
      <p class="text-gray-600">เว็บไซต์ต้นแบบสำหรับท่องเที่ยวเกาะล้าน</p>
    </div>
  </main>

  <!-- Tabs -->
  <section id="finance" class="hidden p-4">
    <h2 class="text-lg font-bold text-green-600">💰 ระบบบันทึกรายรับ-รายจ่าย</h2>
    <input type="number" id="amount" placeholder="จำนวนเงิน" class="border p-2 w-full my-2">
    <select id="category" class="border p-2 w-full my-2">
      <option>อาหาร</option>
      <option>เดินทาง</option>
      <option>ที่พัก</option>
    </select>
    <button onclick="addExpense()" class="bg-green-500 text-white px-4 py-2 rounded">บันทึก</button>
    <div id="summary" class="mt-4 text-gray-700"></div>
  </section>

  <section id="location" class="hidden p-4">
    <h2 class="text-lg font-bold text-green-600">📍 ระบบติดตามตำแหน่ง</h2>
    <button onclick="getLocation()" class="bg-green-500 text-white px-4 py-2 rounded">ดึงตำแหน่ง</button>
    <div id="geoInfo" class="mt-4 text-gray-700 whitespace-pre-line"></div>
  </section>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full bg-green-200 shadow-inner flex justify-around py-2">
    <button onclick="showTab('feed')" class="text-green-700">🏠 หน้าแรก</button>
    <button onclick="showTab('finance')" class="text-green-700">💰 รายรับ-รายจ่าย</button>
    <button onclick="showTab('location')" class="text-green-700">📍 ตำแหน่ง</button>
  </nav>

  <!-- JavaScript -->
  <script>
    // State Management สำหรับ Tab
    function showTab(tab) {
      document.getElementById('feed').classList.add('hidden');
      document.getElementById('finance').classList.add('hidden');
      document.getElementById('location').classList.add('hidden');
      document.getElementById(tab).classList.remove('hidden');
    }

    // ระบบรายรับ-รายจ่าย
    let balance = 0;
    function addExpense() {
      const amount = parseFloat(document.getElementById('amount').value);
      if (!isNaN(amount)) {
        balance -= amount;
        document.getElementById('summary').innerText = `ยอดคงเหลือ: ${balance} บาท`;
      }
    }

    // ระบบติดตามตำแหน่ง
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition);
      } else {
        document.getElementById('geoInfo').innerText = "ไม่รองรับ Geolocation";
      }
    }

    function showPosition(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      // พิกัดบ้าน
      const homeLat = 15.729713;
      const homeLon = 102.294131;

      // Haversine Formula
      const R = 6371; // km
      const dLat = (homeLat - lat) * Math.PI / 180;
      const dLon = (homeLon - lon) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat * Math.PI/180) * Math.cos(homeLat * Math.PI/180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const distance = R * c;

      document.getElementById('geoInfo').innerText =
        `ตำแหน่งปัจจุบัน: Lat ${lat}, Lon ${lon}\nระยะทางจากบ้าน: ${distance.toFixed(2)} กม.`;
    }
  </script>
</body>
</html>
