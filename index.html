<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KML Navigator Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@mapbox/togeojson@0.16.0/togeojson.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        .ui-overlay { position: absolute; top: 15px; left: 15px; z-index: 1000; display: flex; align-items: center; gap: 10px; }
        
        #search-container { display: flex; align-items: center; background: white; padding: 5px; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #search-bar { display: none; width: 200px; padding: 10px; border: none; outline: none; background: transparent; }
        #search-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #2196F3; color: white; cursor: pointer; }
        
        .fab-container { position: absolute; bottom: 30px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .fab { width: 50px; height: 50px; border-radius: 50%; border: none; background: #2196F3; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 20px; display: flex; align-items: center; justify-content: center; }
        
        #info-panel { position: absolute; top: 70px; left: 15px; background: rgba(255,255,255,0.9); padding: 8px 15px; border-radius: 20px; z-index: 1000; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="ui-overlay">
    <div id="search-container">
        <button id="search-btn" onclick="toggleSearch()">🔍</button>
        <input type="text" id="search-bar" placeholder="ค้นหาจุดหมาย...">
    </div>
</div>

<div id="info-panel">ระยะทาง: <span id="dist">--</span> กม.</div>

<div class="fab-container">
    <button class="fab" onclick="toggleLayer()">🗺️</button>
    <input type="file" id="kml-input" style="display:none" accept=".kml">
    <button class="fab" onclick="document.getElementById('kml-input').click()">📂</button>
    <button class="fab" onclick="clearAll()">🗑️</button>
    <button class="fab" id="follow-btn" onclick="toggleFollow()">📍</button>
</div>

<div id="map"></div>

<script>
    const map = L.map('map', { zoomControl: false }).setView([13.7367, 100.5231], 13);
    
    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });
    
    let isSat = true;
    satLayer.addTo(map);

    function toggleLayer() {
        if (isSat) { map.removeLayer(satLayer); streetLayer.addTo(map); }
        else { map.removeLayer(streetLayer); satLayer.addTo(map); }
        isSat = !isSat;
    }

    function toggleSearch() {
        const bar = document.getElementById('search-bar');
        bar.style.display = (bar.style.display === 'block') ? 'none' : 'block';
        if(bar.style.display === 'block') bar.focus();
    }

    let routeLayer, currentPosMarker, targetMarker, follow = true;
    let targetLatLng = null;

    document.getElementById('search-bar').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const query = this.value;
            if (!query) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        setTarget([parseFloat(data[0].lat), parseFloat(data[0].lon)], data[0].display_name);
                    } else {
                        alert("ไม่พบสถานที่");
                    }
                }).catch(err => console.error("Search error:", err));
        }
    });

    function setTarget(latlng, name) {
        if(targetMarker) map.removeLayer(targetMarker);
        targetLatLng = latlng;
        targetMarker = L.marker(targetLatLng).addTo(map).bindPopup(name || "จุดหมายปลายทาง").openPopup();
        map.setView(targetLatLng, 16);
    }

    document.getElementById('kml-input').addEventListener('change', function(e) {
        if (!e.target.files.length) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const xml = new DOMParser().parseFromString(event.target.result, 'text/xml');
                const geojson = toGeoJSON.kml(xml);
                if(routeLayer) map.removeLayer(routeLayer);
                routeLayer = L.geoJSON(geojson, { style: { color: '#FF0000', weight: 6 } }).addTo(map);
                map.fitBounds(routeLayer.getBounds());
            } catch (err) {
                console.error("KML Parse error:", err);
            }
        };
        reader.readAsText(e.target.files[0]);
    });

    map.on('contextmenu', e => {
        setTarget(e.latlng, "จุดหมายปลายทาง");
    });

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(pos => {
            const latlng = [pos.coords.latitude, pos.coords.longitude];
            if (!currentPosMarker) {
                currentPosMarker = L.circleMarker(latlng, { radius: 8, color: '#fff', fillColor: '#2196F3', fillOpacity: 1 }).addTo(map);
            } else {
                currentPosMarker.setLatLng(latlng);
            }
            if (follow) map.setView(latlng, 16);
            if (targetLatLng) {
                const dist = map.distance(latlng, targetLatLng) / 1000;
                document.getElementById('dist').innerText = dist.toFixed(2);
            }
        }, err => console.warn("GPS error:", err), { enableHighAccuracy: true });
    }

    function toggleFollow() { 
        follow = !follow; 
        document.getElementById('follow-btn').style.background = follow ? '#2196F3' : '#757575';
    }
    
    function clearAll() { 
        if(routeLayer) map.removeLayer(routeLayer);
        if(targetMarker) { map.removeLayer(targetMarker); targetLatLng = null; }
        document.getElementById('dist').innerText = '--';
    }
</script>
</body>
</html>
