<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoneyFlow - จัดการการเงิน</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #B5B9FF;
            --primary-dark: #8A8FEE;
            --primary-light: rgba(181, 185, 255, 0.15);
            --income: #B8E6D5;
            --income-dark: #7FD1B8;
            --expense: #FFB5B5;
            --expense-dark: #FF8B8B;
            --bg-gradient-1: #F8FAFC;
            --bg-gradient-2: #E8ECF1;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --text-tertiary: #C7C7CC;
            --divider: #E5E5EA;
            --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-medium: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Sarabun', sans-serif;
            background: linear-gradient(180deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            padding: 16px;
            color: var(--text-primary);
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding-bottom: 20px;
        }

        /* Header */
        .header {
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-medium);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .balance-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            gap: 12px;
        }

        .summary-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-md);
            padding: 14px;
        }

        .summary-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 18px;
            font-weight: 700;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-soft);
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* Chart */
        .chart-container {
            position: relative;
            height: 220px;
        }

        /* Type Tabs */
        .type-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            background: rgba(142, 142, 147, 0.1);
            padding: 4px;
            border-radius: var(--radius-md);
        }

        .type-tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .type-tab.active[data-type="income"] {
            background: var(--income);
            color: var(--income-dark);
        }

        .type-tab.active[data-type="expense"] {
            background: var(--expense);
            color: var(--expense-dark);
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--divider);
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--text-primary);
            background: var(--card-bg);
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Category Picker Button */
        .category-picker-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--divider);
            border-radius: var(--radius-md);
            background: var(--card-bg);
            cursor: pointer;
            font-family: inherit;
        }

        .category-display {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--income);
        }

        .category-text {
            font-size: 15px;
            font-weight: 500;
        }

        .category-arrow {
            color: var(--text-tertiary);
            font-size: 18px;
        }

        /* Form Row */
        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 107, 107, 0.1);
            color: #FF6B6B;
            margin-top: 10px;
        }

        /* Transaction List */
        .transaction-list {
            list-style: none;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--divider);
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 14px;
        }

        .transaction-icon.income {
            background: var(--income);
        }

        .transaction-icon.expense {
            background: var(--expense);
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-desc {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .transaction-details {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .transaction-amount {
            font-size: 16px;
            font-weight: 700;
            margin-left: 12px;
        }

        .transaction-amount.income {
            color: var(--income-dark);
        }

        .transaction-amount.expense {
            color: var(--expense-dark);
        }

        .btn-delete {
            background: rgba(255, 107, 107, 0.1);
            color: #FF6B6B;
            border: none;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-left: 10px;
            font-size: 13px;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-tertiary);
        }

        .empty-state-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .storage-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: var(--income-dark);
            background: rgba(127, 209, 184, 0.15);
            padding: 10px;
            border-radius: var(--radius-sm);
            margin-top: 12px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        /* Modal */
        .modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            max-height: 85vh;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            background: rgba(142, 142, 147, 0.1);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-secondary);
        }

        .modal-body {
            padding: 0;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--divider);
        }

        /* Icon Picker Grid */
        .icon-picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 24px;
        }

        .icon-picker-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .icon-picker-item:active {
            transform: scale(0.93);
        }

        .icon-picker-item.selected {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .icon-picker-emoji {
            font-size: 36px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient-1);
            border-radius: var(--radius-md);
            transition: all 0.2s;
        }

        .icon-picker-item.selected .icon-picker-emoji {
            background: var(--primary);
            transform: scale(1.1);
        }

        .icon-picker-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-picker-item.selected .icon-picker-label {
            color: var(--primary-dark);
            font-weight: 600;
        }

        .btn-confirm {
            background: var(--primary);
            color: white;
            padding: 14px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* Responsive */
        @media (max-width: 360px) {
            .balance-amount {
                font-size: 30px;
            }

            .chart-container {
                height: 180px;
            }

            .icon-picker-grid {
                gap: 8px;
                padding: 16px;
            }

            .icon-picker-emoji {
                font-size: 32px;
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">MoneyFlow 💸</div>
            <div class="header-subtitle">จัดการการเงินของคุณอย่างง่ายดาย</div>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <div class="balance-label">ยอดเงินคงเหลือ</div>
            <div class="balance-amount">฿<span id="balance">0</span></div>
            <div class="summary-row">
                <div class="summary-item">
                    <div class="summary-label">รายรับ</div>
                    <div class="summary-value">+฿<span id="income">0</span></div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">รายจ่าย</div>
                    <div class="summary-value">-฿<span id="expense">0</span></div>
                </div>
            </div>
        </div>

        <!-- Chart Card -->
        <div class="card">
            <div class="card-title">📊 สัดส่วนการเงิน</div>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- Add Transaction Card -->
        <div class="card">
            <div class="card-title">➕ เพิ่มรายการใหม่</div>
            
            <div class="type-tabs">
                <button class="type-tab active" data-type="income" onclick="selectType('income')">💵 รายรับ</button>
                <button class="type-tab" data-type="expense" onclick="selectType('expense')">💸 รายจ่าย</button>
            </div>

            <div class="form-group">
                <label class="form-label">หมวดหมู่</label>
                <button class="category-picker-btn" onclick="openCategoryPicker()">
                    <div class="category-display">
                        <div class="category-icon" id="selectedCategoryIcon">💼</div>
                        <span class="category-text" id="selectedCategoryText">เงินเดือน</span>
                    </div>
                    <span class="category-arrow">›</span>
                </button>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">จำนวนเงิน</label>
                    <input type="number" class="form-control" id="amount" placeholder="0">
                </div>
                <div class="form-group">
                    <label class="form-label">วันที่</label>
                    <input type="date" class="form-control" id="date">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">รายละเอียด</label>
                <input type="text" class="form-control" id="description" placeholder="เช่น เงินเดือน, ค่าอาหาร">
            </div>

            <button class="btn btn-primary" onclick="addTransaction()">บันทึกรายการ</button>
            <button class="btn btn-secondary" onclick="showClearModal()">🗑️ ล้างข้อมูลทั้งหมด</button>
            <div class="storage-indicator">✓ บันทึกอัตโนมัติ</div>
        </div>

        <!-- Transaction List Card -->
        <div class="card">
            <div class="card-title">📋 รายการล่าสุด</div>
            <ul class="transaction-list" id="transactionList">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">📝</div>
                    <div>ยังไม่มีรายการ</div>
                </div>
            </ul>
        </div>
    </div>

    <!-- Category Picker Modal -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">เลือกหมวดหมู่</div>
                <button class="modal-close" onclick="closeCategoryPicker()">✕</button>
            </div>
            <div class="modal-body">
                <div class="icon-picker-grid" id="categoryPickerGrid"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-confirm" onclick="confirmCategory()">เลือกหมวดหมู่นี้</button>
            </div>
        </div>
    </div>

    <!-- Clear Modal -->
    <div class="modal-overlay" id="clearModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">ยืนยันการล้างข้อมูล</div>
                <button class="modal-close" onclick="hideClearModal()">✕</button>
            </div>
            <div class="modal-body">
                <div style="padding: 24px;">
                    <p style="font-size: 15px; color: var(--text-secondary); line-height: 1.6;">
                        ข้อมูลทั้งหมดจะถูกลบอย่างถาวร คุณต้องการดำเนินการต่อหรือไม่?
                    </p>
                </div>
            </div>
            <div class="modal-footer">
                <div style="display: flex; gap: 10px;">
                    <button class="btn" style="background: var(--divider); flex: 1;" onclick="hideClearModal()">ยกเลิก</button>
                    <button class="btn" style="background: #FF6B6B; color: white; flex: 1;" onclick="confirmClear()">ล้างข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลหมวดหมู่
        const categories = {
            income: [
                { id: 'salary', emoji: '💼', name: 'เงินเดือน' },
                { id: 'bonus', emoji: '🎁', name: 'โบนัส' },
                { id: 'investment', emoji: '📈', name: 'การลงทุน' },
                { id: 'freelance', emoji: '💻', name: 'ฟรีแลนซ์' },
                { id: 'rental', emoji: '🏠', name: 'ค่าเช่า' },
                { id: 'dividend', emoji: '💰', name: 'เงินปันผล' },
                { id: 'gift', emoji: '🎉', name: 'ของขวัญ' },
                { id: 'other_income', emoji: '✨', name: 'อื่นๆ' }
            ],
            expense: [
                { id: 'food', emoji: '🍔', name: 'อาหาร' },
                { id: 'shopping', emoji: '🛍️', name: 'ช้อปปิ้ง' },
                { id: 'transport', emoji: '🚗', name: 'การเดินทาง' },
                { id: 'utilities', emoji: '💡', name: 'ค่าน้ำไฟ' },
                { id: 'entertainment', emoji: '🎬', name: 'นันทนาการ' },
                { id: 'health', emoji: '💊', name: 'สุขภาพ' },
                { id: 'education', emoji: '📚', name: 'การศึกษา' },
                { id: 'travel', emoji: '✈️', name: 'ท่องเที่ยว' },
                { id: 'beauty', emoji: '💄', name: 'ความงาม' },
                { id: 'pet', emoji: '🐱', name: 'สัตว์เลี้ยง' },
                { id: 'sport', emoji: '⚽', name: 'กีฬา' },
                { id: 'other_expense', emoji: '📦', name: 'อื่นๆ' }
            ]
        };

        // ตัวแปร
        let transactions = [];
        let balance = 0;
        let totalIncome = 0;
        let totalExpense = 0;
        let currentType = 'income';
        let selectedCategory = categories.income[0];
        let tempCategory = null;
        let expenseChart = null;

        // Load ข้อมูล
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('moneyFlowData');
            if (saved) {
                const data = JSON.parse(saved);
                transactions = data.transactions || [];
                balance = data.balance || 0;
                totalIncome = data.totalIncome || 0;
                totalExpense = data.totalExpense || 0;
            }
        }

        // Save ข้อมูล
        function saveToLocalStorage() {
            const data = {
                transactions: transactions,
                balance: balance,
                totalIncome: totalIncome,
                totalExpense: totalExpense
            };
            localStorage.setItem('moneyFlowData', JSON.stringify(data));
        }

        // เลือกประเภท
        function selectType(type) {
            currentType = type;
            document.querySelectorAll('.type-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.type === type);
            });
            selectedCategory = categories[type][0];
            updateCategoryDisplay();
        }

        // แสดงหมวดหมู่ที่เลือก
        function updateCategoryDisplay() {
            document.getElementById('selectedCategoryIcon').textContent = selectedCategory.emoji;
            document.getElementById('selectedCategoryText').textContent = selectedCategory.name;
        }

        // เปิด Modal หมวดหมู่
        function openCategoryPicker() {
            tempCategory = selectedCategory;
            renderCategoryPicker();
            document.getElementById('categoryModal').classList.add('active');
        }

        // ปิด Modal หมวดหมู่
        function closeCategoryPicker() {
            document.getElementById('categoryModal').classList.remove('active');
        }

        // แสดง Icon Picker
        function renderCategoryPicker() {
            const grid = document.getElementById('categoryPickerGrid');
            const list = categories[currentType];
            
            grid.innerHTML = list.map(cat => {
                const isSelected = selectedCategory.id === cat.id;
                return '<div class="icon-picker-item' + (isSelected ? ' selected' : '') + '" onclick="selectCategory(\'' + cat.id + '\')">' +
                    '<div class="icon-picker-emoji">' + cat.emoji + '</div>' +
                    '<div class="icon-picker-label">' + cat.name + '</div>' +
                    '</div>';
            }).join('');
        }

        // เลือกหมวดหมู่ใน Modal
        function selectCategory(categoryId) {
            const list = categories[currentType];
            tempCategory = list.find(c => c.id === categoryId);
            
            document.querySelectorAll('.icon-picker-item').forEach((item, index) => {
                item.classList.toggle('selected', list[index].id === categoryId);
            });
        }

        // ยืนยันเลือกหมวดหมู่
        function confirmCategory() {
            if (tempCategory) {
                selectedCategory = tempCategory;
                updateCategoryDisplay();
            }
            closeCategoryPicker();
        }

        // สร้างกราฟ
        function createChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['รายรับ', 'รายจ่าย'],
                    datasets: [{
                        data: [totalIncome, totalExpense],
                        backgroundColor: ['#7FD1B8', '#FF8B8B'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 13 },
                                color: '#8E8E93',
                                padding: 16
                            }
                        }
                    }
                }
            });
        }

        // อัปเดตกราฟ
        function updateChart() {
            if (expenseChart) {
                expenseChart.data.datasets[0].data = [totalIncome, totalExpense];
                expenseChart.update();
            }
        }

        // เพิ่มรายการ
        function addTransaction() {
            const description = document.getElementById('description').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const dateInput = document.getElementById('date').value;

            if (!description || !amount || amount <= 0) {
                alert('กรุณากรอกรายละเอียดและจำนวนเงินให้ถูกต้อง');
                return;
            }

            const date = dateInput 
                ? new Date(dateInput).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' })
                : new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });

            const transaction = {
                id: Date.now(),
                type: currentType,
                category: selectedCategory.id,
                emoji: selectedCategory.emoji,
                categoryName: selectedCategory.name,
                description: description,
                amount: amount,
                date: date
            };

            transactions.unshift(transaction);

            if (currentType === 'income') {
                totalIncome += amount;
                balance += amount;
            } else {
                totalExpense += amount;
                balance -= amount;
            }

            updateUI();
            updateChart();
            saveToLocalStorage();
            clearForm();
        }

        // ลบรายการ
        function deleteTransaction(id) {
            const index = transactions.findIndex(t => t.id === id);
            if (index !== -1) {
                const t = transactions[index];
                if (t.type === 'income') {
                    totalIncome -= t.amount;
                    balance -= t.amount;
                } else {
                    totalExpense -= t.amount;
                    balance += t.amount;
                }
                transactions.splice(index, 1);
                updateUI();
                updateChart();
                saveToLocalStorage();
            }
        }

        // Modal ล้างข้อมูล
        function showClearModal() {
            document.getElementById('clearModal').classList.add('active');
        }

        function hideClearModal() {
            document.getElementById('clearModal').classList.remove('active');
        }

        function confirmClear() {
            transactions = [];
            balance = 0;
            totalIncome = 0;
            totalExpense = 0;
            localStorage.removeItem('moneyFlowData');
            updateUI();
            updateChart();
            hideClearModal();
        }

        // อัปเดต UI
        function updateUI() {
            document.getElementById('balance').textContent = balance.toLocaleString();
            document.getElementById('income').textContent = totalIncome.toLocaleString();
            document.getElementById('expense').textContent = totalExpense.toLocaleString();

            const list = document.getElementById('transactionList');
            const empty = document.getElementById('emptyState');

            if (transactions.length === 0) {
                list.innerHTML = '';
                list.appendChild(empty);
            } else {
                list.innerHTML = transactions.map(t => 
                    '<li class="transaction-item">' +
                    '<div class="transaction-icon ' + t.type + '">' + t.emoji + '</div>' +
                    '<div class="transaction-info">' +
                    '<div class="transaction-desc">' + t.description + '</div>' +
                    '<div class="transaction-details">' + t.date + ' • ' + t.categoryName + '</div>' +
                    '</div>' +
                    '<div style="display:flex;align-items:center;">' +
                    '<div class="transaction-amount ' + t.type + '">' + (t.type === 'income' ? '+' : '-') + '฿' + t.amount.toLocaleString() + '</div>' +
                    '<button class="btn-delete" onclick="deleteTransaction(' + t.id + ')">ลบ</button>' +
                    '</div>' +
                    '</li>'
                ).join('');
            }
        }

        // ล้างฟอร์ม
        function clearForm() {
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('date').value = '';
        }

        // เริ่มต้น
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        loadFromLocalStorage();
        updateUI();
        createChart();
    </script>
</body>
</html>
