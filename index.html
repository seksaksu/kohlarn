  <script src="/_sdk/e063511df281944a.editing_sdk.js" integrity="sha512-Xa8p4aPfoMxVnzxQE2WAG0FfoaPLxdjOJMfUZGm1yZosJTYmnNDvgLkJ2EoN0i3zxjeQVAzUMSXNvTKQVqbXyQ=="></script>
  <script src="/_sdk/0179d719c431a79e.data_sdk.js" integrity="sha512-OsRvJkI5GkC3MJQcgotQYotpzrMSX415GiKKgvYdxQEEkzD/fdchShO2FMSy0PJr/tiINMXOk5Vl2zAgg6bUiA=="></script>
  <script>
    const HOME_LAT=15.729713,HOME_LNG=102.294131;
    const CAT_ICONS={food:'🍜',transport:'🚤',activity:'🏄',accommodation:'🏨',shopping:'🛍️',snack:'🧋',souvenir:'🎁',rental:'🏍️',ticket:'🎟️',medical:'💊',other:'📦'};
    let records=[];
    let selectedType='expense';

    document.querySelectorAll('.nav-pill').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.nav-pill').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
        if(btn.dataset.tab==='tab-location')fetchLocation();
        if(btn.dataset.tab==='tab-charts')drawCharts();
      });
    });

    document.getElementById('type-income').onclick=()=>{selectedType='income';document.getElementById('type-income').classList.add('selected');document.getElementById('type-expense').classList.remove('selected');};
    document.getElementById('type-expense').onclick=()=>{selectedType='expense';document.getElementById('type-expense').classList.add('selected');document.getElementById('type-income').classList.remove('selected');};

    document.getElementById('expense-form').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const amt=parseFloat(document.getElementById('amount-input').value);
      if(!amt||amt<=0)return;
      if(records.length>=999)return;
      const btn=document.querySelector('[data-template-id="add-btn"]');
      btn.disabled=true;btn.style.opacity='0.5';
      const r=await window.dataSdk.create({amount:amt,category:document.getElementById('category-select').value,type:selectedType,note:document.getElementById('note-input').value||'',created_at:new Date().toISOString(),is_budget:false});
      btn.disabled=false;btn.style.opacity='1';
      if(r.isOk){document.getElementById('amount-input').value='';document.getElementById('note-input').value='';}
    });

    document.getElementById('budget-save').addEventListener('click',async()=>{
      const amt=parseFloat(document.getElementById('budget-input').value);
      if(!amt||amt<=0)return;
      const existing=records.find(r=>r.is_budget===true);
      if(existing){await window.dataSdk.update({...existing,amount:amt});}
      else{await window.dataSdk.create({amount:amt,category:'budget',type:'budget',note:'งบตั้งต้น',created_at:new Date().toISOString(),is_budget:true});}
      document.getElementById('budget-input').value='';
    });

    const dataHandler={
      onDataChanged(data){
        records=data;
        renderSummary();
        renderHistory();
        if(document.getElementById('tab-charts').classList.contains('active'))drawCharts();
      }
    };

    function renderSummary(){
      const txs=records.filter(r=>!r.is_budget);
      const income=txs.filter(r=>r.type==='income').reduce((s,r)=>s+(r.amount||0),0);
      const expense=txs.filter(r=>r.type==='expense').reduce((s,r)=>s+(r.amount||0),0);
      const budgetRec=records.find(r=>r.is_budget===true);
      const budget=budgetRec?budgetRec.amount:0;
      document.getElementById('balance-amount').textContent=`฿${(income-expense).toLocaleString()}`;
      document.getElementById('income-total').textContent=`+฿${income.toLocaleString()}`;
      document.getElementById('expense-total').textContent=`-฿${expense.toLocaleString()}`;
      document.getElementById('budget-display').textContent=`฿${budget.toLocaleString()}`;
      const pct=budget>0?Math.min((expense/budget)*100,100):0;
      document.getElementById('budget-bar').style.width=pct+'%';
      document.getElementById('budget-bar').className='h-full rounded-full transition-all duration-500 '+(pct>80?'bg-gradient-to-r from-rose-400 to-red-500':'bg-gradient-to-r from-emerald-400 to-teal-400');
    }

    function renderHistory(){
      const container=document.getElementById('history-list');
      const txs=records.filter(r=>!r.is_budget).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
      document.getElementById('history-empty').style.display=txs.length?'none':'block';
      const existing=new Map([...container.children].map(el=>[el.dataset.id,el]));
      txs.forEach(item=>{
        let el=existing.get(item.__backendId);
        if(el){updateTx(el,item);existing.delete(item.__backendId);}
        else{el=createTxEl(item);container.appendChild(el);}
      });
      existing.forEach(el=>el.remove());
      lucide.createIcons();
    }

    function createTxEl(item){
      const tmpl=document.getElementById('tx-template');
      const el=tmpl.content.cloneNode(true).firstElementChild;
      el.dataset.id=item.__backendId;
      updateTx(el,item);
      el.querySelector('.tx-delete').addEventListener('click',async()=>{el.style.opacity='0.5';await window.dataSdk.delete(item);});
      return el;
    }

    function updateTx(el,item){
      const d=new Date(item.created_at);
      const dateStr=d.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
      el.querySelector('.tx-cat').textContent=(CAT_ICONS[item.category]||'')+ ' '+dateStr;
      el.querySelector('.tx-note').textContent=item.note||'';
      const amtEl=el.querySelector('.tx-amount');
      amtEl.textContent=(item.type==='income'?'+':'-')+'฿'+(item.amount||0).toLocaleString();
      amtEl.className='font-bold text-sm '+(item.type==='income'?'text-emerald-600':'text-rose-500');
    }

    function drawCharts(){
      const txs=records.filter(r=>!r.is_budget).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
      if(!txs.length)return;
      const byDate={};
      txs.forEach(t=>{
        const d=new Date(t.created_at).toLocaleDateString('th-TH',{day:'numeric',month:'short'});
        if(!byDate[d])byDate[d]={income:0,expense:0};
        if(t.type==='income')byDate[d].income+=t.amount||0;
        else byDate[d].expense+=t.amount||0;
      });
      const labels=Object.keys(byDate);
      const incomes=labels.map(l=>byDate[l].income);
      const expenses=labels.map(l=>byDate[l].expense);
      drawBarChart(labels,incomes,expenses);
      drawLineChart(labels,incomes,expenses);
    }

    function drawBarChart(labels,incomes,expenses){
      const canvas=document.getElementById('bar-chart');
      const ctx=canvas.getContext('2d');
      const W=canvas.offsetWidth;canvas.width=W;canvas.height=200;
      ctx.clearRect(0,0,W,200);
      const max=Math.max(...incomes,...expenses,1);
      const n=labels.length;
      const barW=Math.min(24,((W-60)/n)/2-4);
      const startX=40,chartH=160;
      ctx.strokeStyle='#f3f4f6';ctx.lineWidth=1;
      for(let i=0;i<=4;i++){const y=20+chartH*(1-i/4);ctx.beginPath();ctx.moveTo(startX,y);ctx.lineTo(W-10,y);ctx.stroke();ctx.fillStyle='#9ca3af';ctx.font='10px DM Sans';ctx.fillText(Math.round(max*i/4).toLocaleString(),2,y+3);}
      const step=(W-startX-20)/Math.max(n,1);
      labels.forEach((l,i)=>{
        const x=startX+i*step+step/2;
        const hI=(incomes[i]/max)*chartH;const hE=(expenses[i]/max)*chartH;
        ctx.fillStyle='#34d399';ctx.beginPath();ctx.roundRect(x-barW-1,20+chartH-hI,barW,hI,[4,4,0,0]);ctx.fill();
        ctx.fillStyle='#fb7185';ctx.beginPath();ctx.roundRect(x+1,20+chartH-hE,barW,hE,[4,4,0,0]);ctx.fill();
        ctx.fillStyle='#6b7280';ctx.font='9px DM Sans';ctx.fillText(l,x-12,194);
      });
    }

    function drawLineChart(labels,incomes,expenses){
      const canvas=document.getElementById('line-chart');
      const ctx=canvas.getContext('2d');
      const W=canvas.offsetWidth;canvas.width=W;canvas.height=200;
      ctx.clearRect(0,0,W,200);
      let cumInc=[],cumExp=[],si=0,se=0;
      incomes.forEach((v,i)=>{si+=v;se+=expenses[i];cumInc.push(si);cumExp.push(se);});
      const max=Math.max(...cumInc,...cumExp,1);
      const startX=45,chartH=160,n=labels.length;
      ctx.strokeStyle='#f3f4f6';ctx.lineWidth=1;
      for(let i=0;i<=4;i++){const y=20+chartH*(1-i/4);ctx.beginPath();ctx.moveTo(startX,y);ctx.lineTo(W-10,y);ctx.stroke();ctx.fillStyle='#9ca3af';ctx.font='10px DM Sans';ctx.fillText(Math.round(max*i/4).toLocaleString(),2,y+3);}
      const step=(W-startX-20)/Math.max(n-1,1);
      // Fill area
      ctx.beginPath();ctx.moveTo(startX,20+chartH);
      cumInc.forEach((v,i)=>{ctx.lineTo(startX+i*step,20+chartH*(1-v/max));});
      ctx.lineTo(startX+(n-1)*step,20+chartH);ctx.closePath();ctx.fillStyle='rgba(52,211,153,0.1)';ctx.fill();
      ctx.beginPath();ctx.strokeStyle='#34d399';ctx.lineWidth=2.5;ctx.lineJoin='round';
      cumInc.forEach((v,i)=>{const x=startX+i*step;const y=20+chartH*(1-v/max);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
      ctx.beginPath();ctx.moveTo(startX,20+chartH);
      cumExp.forEach((v,i)=>{ctx.lineTo(startX+i*step,20+chartH*(1-v/max));});
      ctx.lineTo(startX+(n-1)*step,20+chartH);ctx.closePath();ctx.fillStyle='rgba(251,113,133,0.1)';ctx.fill();
      ctx.beginPath();ctx.strokeStyle='#fb7185';ctx.lineWidth=2.5;ctx.lineJoin='round';
      cumExp.forEach((v,i)=>{const x=startX+i*step;const y=20+chartH*(1-v/max);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
      cumInc.forEach((v,i)=>{const x=startX+i*step;const y=20+chartH*(1-v/max);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#34d399';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();});
      cumExp.forEach((v,i)=>{const x=startX+i*step;const y=20+chartH*(1-v/max);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#fb7185';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();});
      labels.forEach((l,i)=>{ctx.fillStyle='#6b7280';ctx.font='9px DM Sans';ctx.fillText(l,startX+i*step-12,195);});
    }

    function fetchLocation(){
      if(!navigator.geolocation){document.getElementById('location-address').textContent='ไม่รองรับ';return;}
      document.getElementById('location-address').textContent='กำลังค้นหา...';
      navigator.geolocation.getCurrentPosition(pos=>{
        const{latitude,longitude}=pos.coords;
        const dist=haversine(latitude,longitude,HOME_LAT,HOME_LNG);
        document.getElementById('distance-value').textContent=dist.toFixed(2)+' กม.';
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=th`).then(r=>r.json()).then(d=>{
